<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>绿色军团 — 热座回合制策略游戏</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<div id="game-wrap">
<canvas id="gc"></canvas>
<div id="ui">
  <div id="hud"><span class="pname" id="hudName"></span><span class="turn" id="hudTurn"></span><span class="gold" id="hudGold"></span><span id="onlineHud"></span><span style="flex:1"></span><button class="btn" onclick="openEncyclopedia()" style="font-size:12px;padding:2px 10px">📖 百科</button></div>
  <div id="info"></div>
  <div id="bottom-btns"></div>
  <div id="unit-detail"><div class="ud-icon" id="udIcon"></div><div class="ud-info" id="udInfo"></div><div class="ud-actions" id="udActions"></div></div>
  <div id="hq-panel"></div>
  <div id="turn-notify"><div class="txt" id="notifyTxt"></div></div>
  <div id="tooltip"></div>
  <div class="game-over" id="gameOver">
    <div class="txt" id="goTxt" style="margin-bottom:8px;font-size:38px"></div>
    <div id="statsBox" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 10px;max-width:950px;margin:0 auto"></div>
  </div>
</div>
<div id="menu">
  <div id="menu-bg"><img src="assets/images/初始界面.png" alt=""></div>
  <div id="menu-btns">
    <div class="btn-wrap"><img src="assets/images/开始游戏按钮.png" onclick="showPlayerSel()"></div>
    <button class="btn btn-blue online-menu-btn" onclick="showOnlinePanel()">远程联机</button>
    <div class="btn-wrap"><img src="assets/images/百科全书按钮.png" onclick="openEncyclopedia()"></div>
  </div>
</div>
<div id="player-sel">
  <h2>选择人数</h2>
  <div><button class="btn btn-blue" onclick="startGame(2)">2 人</button><button class="btn btn-blue" onclick="startGame(3)">3 人</button><button class="btn btn-blue" onclick="startGame(4)">4 人</button></div>
  <button class="btn btn-danger" onclick="backToMenu()">返回</button>
</div>
<div id="online-panel">
  <div class="online-card">
    <h2>远程联机</h2>
    <label>服务器地址</label>
    <input id="onlineUrl" value="">
    <label>房间号</label>
    <input id="onlineRoom" placeholder="创建可留空，加入请输入房间号">
    <label>人数</label>
    <div class="online-players">
      <button class="btn btn-blue" onclick="onlineSelectPlayers(2)">2 人</button>
      <button class="btn btn-blue" onclick="onlineSelectPlayers(3)">3 人</button>
      <button class="btn btn-blue" onclick="onlineSelectPlayers(4)">4 人</button>
    </div>
    <div class="online-actions">
      <button class="btn btn-primary" onclick="onlineCreateRoom()">创建房间</button>
      <button class="btn btn-blue" onclick="onlineJoinRoom()">加入房间</button>
      <button class="btn btn-danger" onclick="hideOnlinePanel()">返回</button>
    </div>
    <div id="onlineStatus">未连接</div>
  </div>
</div>
<script src="src/data.js"></script>
<script src="src/main.js"></script>
<script src="src/online.js"></script>
</body>
</html>
