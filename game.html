<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>绿色军团 — 热座回合制策略游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#d0d0d8;font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;overflow:hidden;user-select:none}
#game-wrap{position:relative;width:100vw;height:100vh;overflow:hidden}
canvas{display:block;background:#1a1a2a;cursor:grab}
canvas:active{cursor:grabbing}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#ui>*{pointer-events:auto}
#hud{position:absolute;top:0;left:0;right:0;height:36px;background:rgba(20,20,30,0.9);border-bottom:1px solid #2a2a3e;display:flex;align-items:center;padding:0 12px;gap:12px;font-size:14px}
#hud .pname{font-weight:700}
#hud .gold{color:#caba6a}
#hud .turn{color:#7a7a8a}
#info{position:absolute;top:40px;left:10px;font-size:13px;color:#b0b0c0;text-shadow:0 1px 3px #000;pointer-events:none}
.btn{background:#2a2a3e;border:1px solid #4a4a5e;border-radius:6px;color:#d0d0d8;padding:6px 16px;font-size:13px;font-family:inherit;cursor:pointer;pointer-events:auto;transition:.15s}
.btn:hover{background:#3a3a5e;border-color:#6a6a8a}
.btn:active{transform:scale(.96)}
.btn-primary{background:#1a3a1a;border-color:#3a6a3a;color:#aadaaa}
.btn-primary:hover{background:#2a5a2a}
.btn-danger{background:#3a1a1a;border-color:#6a3a3a;color:#daaaaa}
.btn-danger:hover{background:#5a2a2a}
.btn-blue{background:#1a2a3a;border-color:#3a5a7a;color:#aacada}
.btn-blue:hover{background:#2a4a5a}
#bottom-btns{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
#bottom-btns .btn{min-width:100px;text-align:center}
#unit-detail{position:absolute;bottom:0;left:0;right:0;height:90px;background:rgba(15,15,25,.92);border-top:1px solid #2a2a3e;display:none;align-items:center;padding:8px 16px;gap:16px;z-index:2}
#unit-detail .ud-icon{width:72px;height:72px;border-radius:50%;border:2px solid #4a4a6a;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;background:#0a0a12}
#unit-detail .ud-icon canvas{width:100%;height:100%;border-radius:50%}
#unit-detail .ud-info{flex:1;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12px;min-width:200px}
#unit-detail .ud-info .ud-row{width:100%;display:flex;gap:16px;color:#b0b0c0}
#unit-detail .ud-info .ud-row span{white-space:nowrap}
#unit-detail .ud-info .ud-label{color:#6a6a7a;margin-right:2px}
#unit-detail .ud-info .ud-val{color:#f0e6c0;font-weight:600}
#unit-detail .ud-info .ud-hp{color:#7acc7a}
#unit-detail .ud-info .ud-ap{color:#cc7a7a}
#unit-detail .ud-actions{display:flex;gap:6px;flex-shrink:0}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#14141e,#0a0a0f);pointer-events:auto}
#menu h1{font-size:52px;color:#c8d8a8;text-shadow:0 0 30px rgba(200,216,168,.15);margin-bottom:4px}
#menu .sub{color:#5a5a6a;font-size:16px;margin-bottom:40px}
#menu .menu-btn{background:linear-gradient(135deg,#1a1a28,#14141e);border:1px solid #3a3a5e;border-radius:10px;color:#c0c0d0;padding:14px 60px;font-size:18px;font-family:inherit;cursor:pointer;margin:6px;transition:.2s;min-width:240px}
#menu .menu-btn:hover{background:linear-gradient(135deg,#2a2a3e,#1a1a28);border-color:#5a5a8a;color:#f0e6c0;transform:scale(1.03)}
#menu .menu-btn.green{background:linear-gradient(135deg,#1a2a1a,#141e14);border-color:#3a5a3a}
#menu .menu-btn.green:hover{background:linear-gradient(135deg,#2a3a2a,#1a2a1a);border-color:#5a8a5a}
#menu .menu-btn.blue{background:linear-gradient(135deg,#1a1a2a,#14141e);border-color:#3a3a5a}
#menu .menu-btn.blue:hover{background:linear-gradient(135deg,#2a2a3e,#1a1a28);border-color:#5a5a8a}
#player-sel{display:none;position:fixed;inset:0;z-index:5;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at center,#14141e,#0a0a0f)}
#player-sel h2{color:#8a8a9a;font-size:20px}
#player-sel .btn{padding:12px 40px;font-size:18px}
#turn-notify{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);pointer-events:none;z-index:10}
#turn-notify .txt{font-size:44px;font-weight:700;text-shadow:0 0 40px rgba(255,255,255,.1)}
#hq-panel{position:absolute;top:36px;left:0;width:210px;height:calc(100% - 36px);background:rgba(15,15,25,.95);border-right:1px solid #2a2a3e;display:none;flex-direction:column;padding:10px;gap:4px;z-index:5;pointer-events:auto}
#hq-panel .title{color:#caba6a;font-size:14px;padding:8px 6px;border-bottom:1px solid #2a2a3e;margin-bottom:6px}
#hq-panel .hq-btn{background:#1a1a28;border:1px solid #2a2a3e;border-radius:5px;color:#c0c0d0;padding:7px 10px;font-size:12px;font-family:inherit;cursor:pointer;text-align:left;transition:.1s}
#hq-panel .hq-btn:hover{background:#2a2a3e;border-color:#4a4a6a}
#hq-panel .hq-btn:active{transform:scale(.97)}
#hq-panel .hq-btn.afford{background:#1a2a1a;border-color:#3a5a3a}
#hq-panel .hq-btn.close{background:#2a1a1a;border-color:#5a3a3a;color:#daaaaa;margin-top:auto}
#tooltip{position:absolute;display:none;background:rgba(15,15,25,.95);border:1px solid #3a3a5e;border-radius:6px;padding:8px 12px;font-size:12px;line-height:1.6;z-index:20;pointer-events:none;max-width:260px}
.game-over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:50;pointer-events:auto}
.game-over .txt{font-size:48px;color:#caba6a;text-shadow:0 0 30px rgba(202,186,106,.3)}
</style>
</head>
<body>
<div id="game-wrap">
<canvas id="gc"></canvas>
<div id="ui">
  <div id="hud"><span class="pname" id="hudName"></span><span class="turn" id="hudTurn"></span><span class="gold" id="hudGold"></span></div>
  <div id="info"></div>
  <div id="bottom-btns"></div>
  <div id="unit-detail"><div class="ud-icon" id="udIcon"></div><div class="ud-info" id="udInfo"></div><div class="ud-actions" id="udActions"></div></div>
  <div id="hq-panel"></div>
  <div id="turn-notify"><div class="txt" id="notifyTxt"></div></div>
  <div id="tooltip"></div>
  <div class="game-over" id="gameOver"><div class="txt" id="goTxt"></div></div>
</div>
<div id="menu">
  <h1>绿色军团</h1>
  <div class="sub">热座回合制策略游戏</div>
  <button class="menu-btn green" onclick="showPlayerSel()">🎮 开始游戏</button>
  <button class="menu-btn blue" onclick="openEncyclopedia()">📖 百科全书</button>
</div>
<div id="player-sel">
  <h2>选择人数</h2>
  <div><button class="btn btn-blue" onclick="startGame(2)">2 人</button><button class="btn btn-blue" onclick="startGame(3)">3 人</button><button class="btn btn-blue" onclick="startGame(4)">4 人</button></div>
  <button class="btn btn-danger" onclick="backToMenu()">返回</button>
</div>
<script>
// ==================== 常量 ====================
const TS=64; const MAP_W=80; const MAP_H=80; const FPS=60
const MIN_Z=0.4; const MAX_Z=2.5
const PLAYER_COLORS=['#3c78ff','#ff3c3c','#3cdc3c','#ffdc3c']
const COL_BG='#1a1a2a'; const COL_GL='#2a2f22'; const COL_GD='#22271c'
const COL_WHITE='#ffffff'; const COL_GOLD='#caba6a'; const COL_GRAY='#6a6a7a'
const COL_DARK='#14141e'

// ==================== 数据 ====================
const UNIT_DATA={
  '士兵':{hp:1.5,armor:0,speed:3,damage:1,range:2,price:1,attacks:1},
  '坦克':{hp:10,armor:2,speed:5,damage:4,range:3,price:7,attacks:1},
  '军用吉普':{hp:3,armor:0,speed:8,damage:2,range:3,price:3,attacks:1},
  '火箭炮':{hp:8,armor:.5,speed:2,damage:7,range:15,price:15,attacks:1},
  '野战炮':{hp:4,armor:1,speed:3,damage:5.5,range:8,price:5,attacks:1},
  '装甲车':{hp:7,armor:1,speed:5,damage:1.5,range:3,price:6,attacks:3,canTargetAir:true},
  '战斗机':{hp:5,armor:1,speed:10,damage:5.5,range:3,price:8,attacks:1,isAir:true,canTargetAir:true},
  '轰炸机':{hp:20,armor:3,speed:5,damage:12,range:1,price:15,attacks:1,isAir:true,blast:3,reload:2},
  '防空车':{hp:5,armor:1,speed:5,damage:3,range:4,price:10,attacks:1,canTargetAir:true,airDamage:8,airRange:14},
}
const U_NAMES=Object.keys(UNIT_DATA)
const BUILDING_DATA={
  '大本营':{tiers:[
    {hp:20,armor:0,gold:3,upgradeCost:10,upgradeTime:3},
    {hp:50,armor:.5,gold:5,upgradeCost:30,upgradeTime:8,turret:{damage:2,attacks:2,range:5}},
    {hp:120,armor:1,gold:8,turret:{damage:3,attacks:3,range:8}},
  ]},
  '据点':{hp:20,armor:0,gold:3,captureTurret:{damage:2,attacks:2,range:5}},
  '资源采集器':{hp:15,armor:0,gold:3,cost:8},
}
const EQUIP_DATA={
  '士兵':[{name:'射手步枪',cost:0.5,dmg:0.5,range:4,speed:-1,canTargetAir:true,tier:'T2',researchCost:5,researchTime:2},
          {name:'反器械枪',cost:1.5,dmg:4,range:2,canTargetAir:true,tier:'T2',researchCost:5,researchTime:2}],
  '坦克':[{name:'穿甲炮',cost:2,dmg:3,range:1,tier:'T3',researchCost:10,researchTime:3},
          {name:'高爆炮',cost:1,dmg:-2,blast:3,tier:'T3',researchCost:10,researchTime:3}],
  '军用吉普':[{name:'火箭助推',cost:1,speed:5,hp:1,tier:'T2',researchCost:5,researchTime:2}],
  '火箭炮':[{name:'对空雷达',cost:3,range:1,canTargetAir:true,tier:'T3',researchCost:10,researchTime:3}],
  '野战炮':[{name:'轻量化',cost:-2,dmg:-1,hp:-1,tier:'T2',researchCost:5,researchTime:2},
            {name:'巨炮',cost:6,dmg:7,range:4,speed:-1,hp:3,tier:'T3',researchCost:10,researchTime:3}],
}

// ==================== 工具函数 ====================
function manh(a,b){return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])}
function neighbors(gx,gy){return[[0,1],[0,-1],[1,0],[-1,0]].map(d=>[gx+d[0],gy+d[1]])}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
function lerp(a,b,t){return a+(b-a)*t}
function applyEquip(d,eq){
  if(!eq)return Object.assign({},d)
  let r=Object.assign({},d)
  if(eq.dmg!==undefined)r.damage=(r.damage||0)+eq.dmg
  if(eq.range!==undefined)r.range=(r.range||0)+eq.range
  if(eq.speed!==undefined)r.speed=(r.speed||0)+eq.speed
  if(eq.hp!==undefined)r.hp=Math.max(.5,(r.hp||1)+eq.hp)
  if(eq.cost!==undefined)r.price=(r.price||0)+eq.cost
  if(eq.canTargetAir)r.canTargetAir=true
  if(eq.blast!==undefined)r.blast=eq.blast
  return r
}

// ==================== 游戏状态 ====================
let G=null,ctx=null,cvs=null
let W=window.innerWidth,H=window.innerHeight

function resize(){
  W=window.innerWidth;H=window.innerHeight
  if(cvs){cvs.width=W;cvs.height=H}
  if(G&&G.cam)G.cam.sw=W,G.cam.sh=H
}

// ==================== 摄像机 ====================
class Camera{
  constructor(mpw,mph,sw,sh){
    this.mpw=mpw;this.mph=mph;this.sw=sw;this.sh=sh
    this.ox=0;this.oy=0;this.z=1;this.tz=1;this.tox=0;this.toy=0
    this.drag=false;this.dsx=0;this.dsy=0;this.dox=0;this.doy=0
  }
  w2s(wx,wy){return[wx*this.z+this.ox,wy*this.z+this.oy]}
  s2w(sx,sy){return[(sx-this.ox)/this.z,(sy-this.oy)/this.z]}
  s2g(sx,sy){let[wxx,wyy]=this.s2w(sx,sy);return[Math.floor(wxx/TS),Math.floor(wyy/TS)]}
  g2s(gx,gy){return this.w2s(gx*TS,gy*TS)}
  centerOn(gx,gy){
    this.tox=this.sw/2-gx*TS*this.z;this.toy=this.sh/2-gy*TS*this.z
    this._clamp()
  }
  pan(dx,dy){this.tox+=dx;this.toy+=dy;this._clamp()}
  startDrag(sx,sy){this.drag=true;this.dsx=sx;this.dsy=sy;this.dox=this.ox;this.doy=this.oy}
  endDrag(){this.drag=false}
  updateDrag(sx,sy){if(this.drag){let dx=sx-this.dsx,dy=sy-this.dsy;this.tox=this.dox+dx;this.toy=this.doy+dy;this._clamp()}}
  zoomAt(sx,sy,dz){
    let[wx,wy]=this.s2w(sx,sy)
    this.tz=clamp(this.tz+dz,MIN_Z,MAX_Z)
    this.tox=sx-wx*this.tz;this.toy=sy-wy*this.tz;this._clamp()
  }
  getVR(){
    let[l,t]=this.s2w(0,0);let[r,b]=this.s2w(this.sw,this.sh)
    return[clamp(Math.floor(l/TS),0,MAP_W-1),clamp(Math.floor(t/TS),0,MAP_H-1),clamp(Math.ceil(r/TS)+1,0,MAP_W),clamp(Math.ceil(b/TS)+1,0,MAP_H)]
  }
  update(){
    this.z=lerp(this.z,this.tz,.15);this.ox=lerp(this.ox,this.tox,.15);this.oy=lerp(this.oy,this.toy,.15)
  }
  _clamp(){
    let mx=this.mpw*this.z-this.sw,my=this.mph*this.z-this.sh
    this.tox=clamp(this.tox,-Math.max(mx,0),0);this.toy=clamp(this.toy,-Math.max(my,0),0)
  }
}

// ==================== 网格 ====================
class Grid{
  constructor(){
    this.tiles=[]
    for(let x=0;x<MAP_W;x++){
      this.tiles[x]=[]
      for(let y=0;y<MAP_H;y++){
        let r=Math.random()
        let t='grass'
        if(r<.03)t='water';else if(r<.08)t='forest';else if(r<.10)t='mountain'
        this.tiles[x][y]={gx:x,gy:y,terrain:t,occ:null,mc:{grass:1,road:.5,forest:2,water:99,mountain:3}[t]||1}
      }
    }

  }
  ib(x,y){return x>=0&&x<MAP_W&&y>=0&&y<MAP_H}
  get(x,y){return this.ib(x,y)?this.tiles[x][y]:null}
  place(e,x,y){let t=this.get(x,y);if(t){t.occ=e;e.gx=x;e.gy=y}}
  remove(e){let t=this.get(e.gx,e.gy);if(t&&t.occ===e)t.occ=null}
}

// ==================== 实体 ====================
class Unit{
  constructor(type,gx,gy,pid,equip){
    let d=applyEquip(UNIT_DATA[type],equip)
    this.type=type;this.gx=gx;this.gy=gy;this.pid=pid;this.equip=equip||null
    this.hp=d.hp;this.maxHp=d.hp;this.armor=d.armor;this.speed=d.speed
    this.damage=d.damage;this.range=d.range;this.attacks=d.attacks||1;this.price=d.price
    this.isAir=d.isAir||false;this.canTargetAir=d.canTargetAir||false
    this.blast=d.blast||1;this.reload=d.reload||0
    this.moved=false;this.attacked=false;this.done=false;this.stationed=false;this.rl=0
  }
  reset(){this.moved=false;this.attacked=false;this.done=false;if(this.rl>0)this.rl--}
  canMove(){return!this.moved&&!this.done}
  canAttack(){return this.moved&&!this.attacked&&!this.done&&this.rl===0}
  moveTo(x,y){this.gx=x;this.gy=y;this.moved=true}
  eR(t){return t&&t.isAir&&this.airRange?this.airRange:this.range}
  eD(t){return t&&t.isAir&&this.airDamage?this.airDamage:this.damage}
  attack(t){
    let dmg=Math.max(0,this.eD(t)-t.armor)*this.attacks*this.blast
    t.takeDamage(dmg)
    this.attacked=true;this.done=true
    if(this.reload>0)this.rl=this.reload
    return dmg
  }
  takeDamage(a){a=Math.min(a,this.hp);this.hp-=a;return a}
  get dead(){return this.hp<=0}
}
class Building{
  constructor(type,gx,gy,pid,tier=0){
    this.type=type;this.gx=gx;this.gy=gy;this.pid=pid;this.tier=tier
    this.upgrading=false;this.upTimer=0;this.captured=false;this.tsd=0;this.dmgThisTurn=false
    this._updateStats()
  }
  _updateStats(){
    if(this.type==='大本营'){
      let t=BUILDING_DATA['大本营'].tiers[this.tier]
      this.maxHp=t.hp;this.hp=this.hp||t.hp;this.armor=t.armor;this.gold=t.gold
      this.upgradeCost=t.upgradeCost;this.upgradeTime=t.upgradeTime;this.turret=t.turret
    }else if(this.type==='据点'){
      let d=BUILDING_DATA['据点']
      this.maxHp=d.hp;this.hp=this.hp||d.hp;this.armor=d.armor
      this.gold=this.captured?d.gold:0;this.turret=this.captured?d.captureTurret:null
    }else{
      let d=BUILDING_DATA[this.type]
      if(d){this.maxHp=d.hp;this.hp=this.hp||d.hp;this.armor=d.armor;this.gold=this.underConstruction?0:d.gold;this.turret=null}
    }
  }
  capture(pid){
    this.pid=pid;this.captured=true
    this.hp=this.maxHp  // 回满血
    this._updateStats();this.tsd=0
  }
  takeDamage(a){
    a=Math.min(a,this.hp);this.hp-=a;this.dmgThisTurn=true;this.tsd=0;return a
  }
  turnStart(){
    this.tsd=this.dmgThisTurn?0:this.tsd+1;this.dmgThisTurn=false
    if(this.tsd>=3&&this.hp<this.maxHp)this.hp=Math.min(this.maxHp,this.hp+2)
  }
  canUpgrade(){return this.type==='大本营'&&this.tier<2&&!this.upgrading}
  startUpgrade(){this.upgrading=true;this.upTimer=this.upgradeTime}
  tickUpgrade(){
    if(!this.upgrading)return false
    this.upTimer--
    if(this.upTimer<=0){this.tier++;this.upgrading=false;this._updateStats();this.hp=this.maxHp;return true}
    return false
  }
  inHeal(gx,gy){return manh([this.gx,this.gy],[gx,gy])<=2}
  get dead(){return this.hp<=0}
}

// ==================== 寻路 ====================
function computeMoveRange(grid,sx,sy,mv,unit){
  let isAir=unit&&unit.isAir
  let cost={};cost[sx+','+sy]=0;let q=[[sx,sy]];let r=new Set()
  while(q.length){
    let[cx,cy]=q.shift();let cc=cost[cx+','+cy]
    for(let[nx,ny] of neighbors(cx,cy)){
      if(!grid.ib(nx,ny))continue
      if(!isAir){
        let t=grid.get(nx,ny);let o=t.occ
        if(o&&o!==unit&&o.pid!==unit.pid)continue
        let nc=cc+t.mc
        if(nc<=mv&&!(nx+','+ny in cost)){cost[nx+','+ny]=nc;q.push([nx,ny]);r.add(nx+','+ny)}
      }else{
        // 空中单位：无视地形/障碍，每格消耗1
        let nc=cc+1
        if(nc<=mv&&!(nx+','+ny in cost)){cost[nx+','+ny]=nc;q.push([nx,ny]);r.add(nx+','+ny)}
      }
    }
  }
  return r
}
function getTilesInRange(cx,cy,rad){
  let r=new Set()
  for(let dx=-rad;dx<=rad;dx++)for(let dy=-rad;dy<=rad;dy++)
    if(Math.abs(dx)+Math.abs(dy)<=rad)r.add((cx+dx)+','+(cy+dy))
  return r
}

// ==================== 选择管理器 ====================
let SEL={u:null,b:null,hl:new Set(),hc:'#ffff0040',phase:'SEL'}

function clearSel(){
  SEL.u=null;SEL.b=null;SEL.hl.clear();SEL.phase='SEL'
  document.getElementById('hq-panel').style.display='none'
}

// ==================== 玩家 ====================
class Player{
  constructor(id,name){
    this.id=id;this.name=name;this.gold=10;this.units=[];this.buildings=[];this.alive=true
    this.researched={}   // {equipName: true} 已研究完成的装备
    this.researching=null // {name, timer} 正在研究的装备
  }
  addUnit(u){if(u&&!this.units.includes(u))this.units.push(u)}
  removeUnit(u){
    let i=this.units.indexOf(u);if(i>=0)this.units.splice(i,1)
    if(!this.units.length&&!this.buildings.some(b=>b.type==='大本营'))this.alive=false
  }
  addBuilding(b){if(b&&!this.buildings.includes(b))this.buildings.push(b)}
  removeBuilding(b){
    let i=this.buildings.indexOf(b);if(i>=0)this.buildings.splice(i,1)
    if(b.type==='大本营'&&!this.buildings.some(b2=>b2.type==='大本营'))this.alive=false
  }
  collectIncome(){this.buildings.forEach(b=>this.gold+=b.gold||0)}
  turnStart(){
    this.units.forEach(u=>{u.reset();if(u.stationed){this.buildings.some(b=>b.type==='大本营'&&b.inHeal(u.gx,u.gy))&&(u.hp=Math.min(u.maxHp,u.hp+1))};u.stationed=false})
    this.buildings.forEach(b=>b.turnStart())
    this.collectIncome()
  }
  getHQ(){return this.buildings.find(b=>b.type==='大本营')}
}

// ==================== 游戏引擎 ====================
let ENGINE={players:[],cur:0,turn:1,state:'MENU'}
function initEngine(n){
  ENGINE.players=[];ENGINE.cur=0;ENGINE.turn=1;ENGINE.state='PLAYING'
  for(let i=0;i<n;i++)ENGINE.players.push(new Player(i,'玩家'+(i+1)))
}
function curP(){return ENGINE.players[ENGINE.cur]}
function showGameOver(winner){
  ENGINE.state='GAME_OVER'
  let el=document.getElementById('gameOver')
  el.style.display='flex'
  document.getElementById('goTxt').textContent=(winner?winner.name:'?')+' 获胜！'
  // 摄像头居中到胜者基地
  if(G&&G.cam){
    let hq=winner?winner.getHQ():null
    if(hq)G.cam.centerOn(hq.gx,hq.gy)
  }
  // 3秒后显示再来一局按钮
  setTimeout(function(){
    let btn=document.createElement('button')
    btn.className='btn btn-primary';btn.style.cssText='position:absolute;bottom:80px;left:50%;transform:translateX(-50%);padding:12px 40px;font-size:18px;z-index:60'
    btn.textContent='再来一局';btn.onclick=function(){location.reload()}
    document.body.appendChild(btn)
  },2000)
}
function nextTurn(){
  let alive=ENGINE.players.filter(p=>p.alive)
  if(alive.length<=1){showGameOver(alive[0]||null);return}
  let was=ENGINE.cur
  // 找下一个活着的玩家
  for(let i=0;i<ENGINE.players.length;i++){ENGINE.cur=(ENGINE.cur+1)%ENGINE.players.length;if(curP().alive)break}
  // 所有玩家都动过 → 回合+1，全局计时/收入
  let wrapped=(ENGINE.cur<=was&&was!==ENGINE.cur)||(was===ENGINE.players.length-1&&ENGINE.cur===0)
  if(wrapped){
    ENGINE.turn++
    ENGINE.players.forEach(p=>{if(p.alive){
      p.buildings.forEach(b=>{
        b.tickUpgrade()
        if(b.underConstruction){
          b.buildTimer--
          if(b.buildTimer<=0){b.underConstruction=false;b.gold=BUILDING_DATA[b.type]?BUILDING_DATA[b.type].gold:0;console.log('Building complete:',b.type)}
        }
      })
      p.collectIncome()
    }})
  }
  curP().turnStart()
  showTurnNotify()
  if(G&&G.cam){let hq=curP().getHQ();if(hq)G.cam.centerOn(hq.gx,hq.gy)}
}
function allDone(){return curP().units.every(u=>u.done)}

// ==================== 主游戏 ====================
class Game{
  constructor(){
    G=this
    let seed=42;Math.random=function(){seed=(seed*9301+49297)%233280;return seed/233280}
    this.grid=new Grid()
    this.cam=new Camera(MAP_W*TS,MAP_H*TS,W,H)
    this.dying=[];this.neutralBuildings=[];this.buildMode=null;this.ghostPos=null
    this.selUnit=null;this.selBuilding=null
    this._placeInit()
    this._centerOnCur()
    this._updateButtons()
  }
  _placeInit(){
    console.log('=== _placeInit ===')
    let n=ENGINE.players.length
    let cs=[[8,8],[MAP_W-9,8],[8,MAP_H-9],[MAP_W-9,MAP_H-9]]
    for(let i=0;i<n&&i<cs.length;i++){
      let[cx,cy]=cs[i];let b=new Building('大本营',cx,cy,i)
      this.grid.place(b,cx,cy);ENGINE.players[i].addBuilding(b)
    }
    ENGINE.players.forEach(p=>p.gold=10)
    // 2人模式：据点在两个基地中间 (40,8)
    // 多人模式：加中心据点
    let placed=0
    let mx=(cs[0][0]+cs[1][0])>>1  // 两个基地x中点
    let my=(cs[0][1]+cs[1][1])>>1  // 两个基地y中点 (都是8)
    let t=this.grid.get(mx,my)
    console.log('Midpoint tile at',mx,my,'occupied?',t?!!t.occ:'null')
    function placeOp(gx,gy){
      let b=new Building('据点',gx,gy,-1)
      this.grid.place(b,gx,gy);this.neutralBuildings.push(b);placed++
    }
    if(t&&!t.occ){placeOp.call(this,mx,my);console.log('PLACED outpost at',mx,my)}
    else{
      for(let d of[[1,0],[-1,0],[0,1],[0,-1]]){
        let t2=this.grid.get(mx+d[0],my+d[1])
        if(t2&&!t2.occ){placeOp.call(this,mx+d[0],my+d[1]);break}
      }
    }
    if(n>2){let cx=MAP_W/2|0,cy=MAP_H/2|0
      let t=this.grid.get(cx,cy)
      if(t&&!t.occ)placeOp.call(this,cx,cy)
    }
    console.log('Total outposts placed:',placed)
  }
  _centerOnCur(){let hq=curP().getHQ();if(hq)this.cam.centerOn(hq.gx,hq.gy)}
  _handleClick(gx,gy){
    let p=curP();let t=this.grid.get(gx,gy);if(!t)return
    // 建造模式
    if(this.buildMode){
      let hq=p.getHQ()
      if(hq&&!t.occ&&manh([gx,gy],[hq.gx,hq.gy])<=5&&p.gold>=8){
        p.gold-=8
        let b=new Building('资源采集器',gx,gy,p.id)
        b.underConstruction=true;b.buildTimer=2
        this.grid.place(b,gx,gy);p.addBuilding(b)
        console.log('Building resource collector, ready in 4 turns')
      }
      this.buildMode=null;this.ghostPos=null;this._updateButtons();return
    }
    let o=t.occ
    if(SEL.phase==='SEL'){
      if(o&&o.pid===p.id){
        if(o instanceof Building&&o.type==='大本营'){SEL.b=o;this._showHQ(o);return}
        if(o instanceof Building&&o.type==='据点'&&o.pid===p.id){SEL.b=o;this._showOutpost(o);return}
        if(o instanceof Unit){this._selUnit(o);return}
      }
      // 点击中立据点可以攻击，已占领的可当基地用
      if(o instanceof Building&&o.type==='据点'&&o.pid!==p.id&&o.pid!==-1){
        // 是敌方据点，攻击模式下可打
      }
      if(o instanceof Building&&o.type==='据点'&&o.pid===-1){SEL.b=o;this._showOutpost(o);return}
      clearSel()
    }else if(SEL.phase==='MOVE'){
      let u=SEL.u;if(!u)return
      if(SEL.hl.has(gx+','+gy)){
        if(t.occ && t.occ!==u){clearSel();return} // 格子有单位/建筑，不能重叠
        this.grid.remove(u);u.moveTo(gx,gy);t.occ=u
        if(u.canAttack()){
          let at=getTilesInRange(gx,gy,u.range);let en=new Set()
          for(let k of at){let[tok]=k.split(',');let[tx,ty]=[+tok,+k.split(',')[1]];let tt=this.grid.get(tx,ty);if(tt&&tt.occ&&tt.occ.pid!==p.id&&(tt.occ instanceof Unit||tt.occ instanceof Building))en.add(k)}
          if(en.size){SEL.hl=en;SEL.hc='#ff000060';SEL.phase='ATK';return}
        }
        u.done=true;clearSel()
      }else if(o instanceof Unit&&o.pid===p.id){this._selUnit(o)}
      else clearSel()
    }else if(SEL.phase==='ATK'){
      let u=SEL.u;if(!u)return
      if(SEL.hl.has(gx+','+gy)){
        let tt=this.grid.get(gx,gy)
        if(tt&&tt.occ&&tt.occ.pid!==p.id){
          let target=tt.occ
          if(target instanceof Unit){
            u.attack(target)
            if(target.dead){this.grid.remove(target);p.removeUnit(target);this.dying.push({ent:target,alpha:255});console.log('Unit died:',target.type)}
            clearSel()
          }else if(target instanceof Building){
            u.attack(target)
            if(target.dead&&target.type==='据点'&&!target.captured){
              target.capture(p.id);p.addBuilding(target)
              let i=this.neutralBuildings.indexOf(target)
              if(i>=0)this.neutralBuildings.splice(i,1)
              console.log('据点 captured by',p.name)
            }
            else if(target.dead){this.grid.remove(target);ENGINE.players.forEach(pp=>pp.removeBuilding(target))}
            clearSel()
          }
        }
      }else clearSel()
    }
    this._updateButtons()
  }
  _selUnit(u){
    SEL.u=u;SEL.b=null
    if(u.canMove()){
      SEL.hl=computeMoveRange(this.grid,u.gx,u.gy,u.speed,u);SEL.hc='#ffff0040';SEL.phase='MOVE'
    }else if(u.canAttack()){
      SEL.hl=getTilesInRange(u.gx,u.gy,u.range);SEL.hc='#ff000060';SEL.phase='ATK'
    }else{SEL.phase='SEL';SEL.hl.clear()}
    this._updateButtons()
  }
  _equipUnit(eqName){
    let u=SEL.u;if(!u)return
    let pp=curP()
    if(!pp.researched[eqName]||u.equip)return  // 没研究或已有装备
    let eqList=EQUIP_DATA[u.type]
    if(!eqList)return
    let eq=eqList.find(e=>e.name===eqName)
    if(!eq||pp.gold<eq.cost)return
    pp.gold-=eq.cost
    // 重新创建单位应用装备
    let nu=new Unit(u.type,u.gx,u.gy,u.pid,eq)
    nu.moved=u.moved;nu.attacked=u.attacked;nu.done=u.done;nu.stationed=u.stationed;nu.hp=u.hp
    this.grid.remove(u);let idx=pp.units.indexOf(u)
    if(idx>=0)pp.units[idx]=nu
    this.grid.place(nu,nu.gx,nu.gy)
    SEL.u=nu
    this._updateButtons()
  }
  _showHQ(b){
    let p=document.getElementById('hq-panel');p.style.display='flex'
    let pp=curP()
    let html='<div class="title">🏰 T'+(b.tier+1)+' HQ  🪙'+pp.gold+'</div>'
    if(b.upgrading){
      html+='<div class="hq-btn" style="color:#caba6a;text-align:center">⬆ 升级中... '+b.upTimer+'回合</div>'
    }else if(b.canUpgrade()){
      let af=pp.gold>=b.upgradeCost
      html+='<button class="hq-btn'+(af?' afford':'')+'" onclick="G._hqUpgrade()">⬆ T'+(b.tier+2)+' 🪙'+b.upgradeCost+'</button>'
    }
    // 研究装备（按T级过滤）
    let tierLabel=['T1','T2','T3']
    for(let ut in EQUIP_DATA){
      if(!EQUIP_DATA[ut])continue
      EQUIP_DATA[ut].forEach(eq=>{
        let eqTier=(eq.tier==='T2'?1:eq.tier==='T3'?2:0)
        if(eqTier>b.tier)return  // 大本营等级不够，不显示
        if(pp.researched[eq.name])return
        if(pp.researching&&pp.researching.name===eq.name){
          html+='<div class="hq-btn" style="color:#7acc7a;text-align:center">🔬 '+eq.name+' 研究中... '+pp.researching.timer+'回合</div>'
          return
        }
        let af=pp.gold>=(eq.researchCost||99)
        html+='<button class="hq-btn'+(af?' afford':'')+'" onclick="G._research(\''+eq.name+'\','+(eq.researchCost||0)+','+(eq.researchTime||1)+')">🔬 '+eq.name+' 🪙'+(eq.researchCost||0)+'</button>'
      })
    }
    // 招募（按T级）
    let pool=['士兵','军用吉普','装甲车'];if(b.tier>=1)pool.push('坦克','野战炮')
    if(b.tier>=2)pool.push('火箭炮','战斗机','轰炸机','防空车')
    pool.forEach(ut=>{
      let cost=UNIT_DATA[ut].price;let af=pp.gold>=cost
      html+='<button class="hq-btn'+(af?' afford':'')+'" onclick="G._recruit(\''+ut+'\')">'+ut+' 🪙'+cost+'</button>'
    })
    html+='<button class="hq-btn'+(pp.gold>=8?' afford':'')+'" onclick="G._startBuild()">⛏️ 资源采集器 🪙8</button>'
    html+='<button class="hq-btn close" onclick="clearSel()">❌ 关闭</button>'
    p.innerHTML=html
  }
  _showOutpost(b){
    let p=document.getElementById('hq-panel');p.style.display='flex'
    let pp=curP()
    let html='<div class="title">⚑ '+(b.pid===pp.id?'已占领':b.pid>=0?'敌方':'中立')+'据点  🪙'+pp.gold+'</div>'
    if(b.pid===pp.id){
      let pool=['士兵','军用吉普','装甲车'];if(pp.getHQ()&&pp.getHQ().tier>=1)pool.push('坦克','野战炮')
      if(pp.getHQ()&&pp.getHQ().tier>=2)pool.push('火箭炮','战斗机','轰炸机','防空车')
      pool.forEach(ut=>{
        let cost=UNIT_DATA[ut].price;let af=pp.gold>=cost
        html+='<button class="hq-btn'+(af?' afford':'')+'" onclick="G._recruitFrom(\''+ut+'\','+b.gx+','+b.gy+')">'+ut+' 🪙'+cost+'</button>'
      })
      html+='<button class="hq-btn close" onclick="clearSel()">❌ 关闭</button>'
    }else if(b.pid===-1){
      html+='<div class="hq-btn" style="color:#8a8a8a;text-align:center">中立据点 — 攻占后归你</div>'
      html+='<button class="hq-btn close" onclick="clearSel()">❌ 关闭</button>'
    }
    p.innerHTML=html
  }
  _research(name,cost,time){
    let pp=curP()
    if(pp.gold<cost||pp.researched[name]||(pp.researching&&pp.researching.name===name))return
    pp.gold-=cost;pp.researching={name:name,timer:time}
    if(SEL.b)this._showHQ(SEL.b);this._updateButtons()
  }
  _hqUpgrade(){
    let b=SEL.b;if(!b)return
    let p=curP()
    if(b.canUpgrade()&&p.gold>=b.upgradeCost){p.gold-=b.upgradeCost;b.startUpgrade();this._showHQ(b);this._updateButtons()}
  }
  _recruitFrom(ut,bx,by){
    let p=curP();let cost=UNIT_DATA[ut].price
    if(p.gold<cost)return
    let pos=this._findSpawn(bx,by)
    if(!pos)return
    p.gold-=cost
    let u=new Unit(ut,pos[0],pos[1],p.id);this.grid.place(u,pos[0],pos[1]);p.addUnit(u)
    this._updateButtons()
  }
  _recruit(ut){
    let b=SEL.b;if(!b)return;let p=curP();let cost=UNIT_DATA[ut].price
    if(p.gold<cost)return
    let pos=this._findSpawn(b.gx,b.gy)
    if(!pos)return
    p.gold-=cost
    let u=new Unit(ut,pos[0],pos[1],p.id);this.grid.place(u,pos[0],pos[1]);p.addUnit(u)
    this._showHQ(b);this._updateButtons()
  }
  _startBuild(){
    let p=curP()
    if(p.gold<8||!SEL.b)return
    this.buildMode='资源采集器';this.ghostPos=null
    clearSel()
  }
  _findSpawn(bx,by){
    for(let r=1;r<4;r++)for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++)
      if(Math.abs(dx)+Math.abs(dy)===r){let t=this.grid.get(bx+dx,by+dy);if(t&&!t.occ)return[bx+dx,by+dy]}
    return null
  }
  update(){
    this.cam.update()
    // 建造计时(已在nextTurn中处理)

    let nd=[]
    this.dying.forEach(d=>{d.alpha-=5;if(d.alpha>0)nd.push(d)})
    this.dying=nd
    // 研究计时
    ENGINE.players.forEach(p=>{
      if(p.researching){
        p.researching.timer--
        if(p.researching.timer<=0){p.researched[p.researching.name]=true;p.researching=null}
      }
    })
    this._updateHUD()
  }
  _updateHUD(){
    try{
      let p=curP();if(!p)return
      document.getElementById('hudName').textContent=p.name
      document.getElementById('hudName').style.color=PLAYER_COLORS[p.id]
      document.getElementById('hudTurn').textContent='回合 '+ENGINE.turn
      let income=p.buildings.reduce((s,b)=>s+(b.gold||0),0)
      document.getElementById('hudGold').textContent='🪙'+p.gold+'  (+'+income+'/回合)'
      document.getElementById('info').textContent=SEL.u?SEL.u.type+' HP:'+SEL.u.hp.toFixed(1)+'/'+SEL.u.maxHp+' 伤害:'+SEL.u.damage+' 射程:'+SEL.u.range+(SEL.u.done?' [Done]':''):''
    }catch(e){}
  }
  _updateButtons(){
    try{
      let bb=document.getElementById('bottom-btns')
      let ud=document.getElementById('unit-detail')
      let ui=document.getElementById('udInfo')
      let ua=document.getElementById('udActions')
      let ic=document.getElementById('udIcon')
      if(!bb)return
      // 底部结束回合按钮
      bb.innerHTML='<button class="btn btn-blue" onclick="endTurn()">结束回合</button>'
      // 单位详情栏
      let u=SEL.u
      if(u){
        ud.style.display='flex'
        // 图标 - 尝试加载PNG贴图，失败回退形状
        let iconUrl='picture/'+u.type+'.png'
        let img=new Image()
        img.onload=function(){ic.innerHTML='';ic.style.overflow='hidden';ic.appendChild(img);img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:50%'}
        img.onerror=function(){
          // 回退canvas绘制形状
          let cvs=document.createElement('canvas');cvs.width=64;cvs.height=64;cvs.style.cssText='width:100%;height:100%;border-radius:50%'
          ic.innerHTML='';ic.appendChild(cvs)
          let cx=cvs.getContext('2d');cx.clearRect(0,0,64,64)
          cx.fillStyle=PLAYER_COLORS[u.pid];cx.strokeStyle='#444';cx.lineWidth=2
          if(u.type==='士兵'||u.type==='军用吉普'){cx.beginPath();cx.arc(32,32,24,0,Math.PI*2);cx.fill();cx.stroke()}
          else if(u.type==='坦克'||u.type==='装甲车'){cx.fillRect(8,10,48,44);cx.strokeRect(8,10,48,44)}
          else if(u.isAir){cx.beginPath();cx.moveTo(32,8);cx.lineTo(56,32);cx.lineTo(32,56);cx.lineTo(8,32);cx.closePath();cx.fill();cx.stroke()}
          else{cx.beginPath();cx.arc(32,32,24,0,Math.PI*2);cx.fill();cx.stroke()}
          console.log('Icon fallback for',u.type)
        }
        try{img.src=iconUrl}catch(e){img.onerror()}
        // 信息
        let hpPct=Math.round(u.hp/u.maxHp*100)
        let hpColor=hpPct>50?'ud-hp':hpPct>25?'#d4c040':'ud-ap'
        let rows='<div class="ud-row"><span>'+u.type+'</span><span style="color:'+PLAYER_COLORS[u.pid]+'">玩家'+(u.pid+1)+'</span></div>'
        rows+='<div class="ud-row"><span>❤️ <span class="ud-val" style="color:'+hpColor+'">'+u.hp.toFixed(1)+'/'+u.maxHp.toFixed(1)+'</span></span><span>🛡️ <span class="ud-val">'+u.armor+'</span></span><span>💨 <span class="ud-val">'+u.speed+'</span></span><span>🔫 <span class="ud-val">'+u.damage+'</span></span><span>🎯 <span class="ud-val">'+u.range+'</span></span></div>'
        if(u.equip)rows+='<div class="ud-row"><span>🛠️ <span class="ud-val">'+u.equip.name+'</span></span></div>'
        if(u.done)rows+='<div class="ud-row"><span style="color:#6a6a7a">[已行动]</span></div>'
        ui.innerHTML=rows
        // 操作按钮
        let acts=''
        if(!u.done){
          acts+='<button class="btn" onclick="skipUnit()" style="font-size:12px;padding:4px 12px">跳过</button>'
          if(curP().buildings.some(b=>b.type==='大本营'&&b.inHeal(u.gx,u.gy)))
            acts+='<button class="btn btn-primary" onclick="stationUnit()" style="font-size:12px;padding:4px 12px">驻扎</button>'
          // 装备
          if(!u.equip){
            let eqs=EQUIP_DATA[u.type]
            if(eqs)eqs.forEach(eq=>{
              if(curP().researched[eq.name]&&curP().gold>=eq.cost)
                acts+='<button class="btn btn-primary" onclick="G._equipUnit(\''+eq.name+'\')" style="font-size:11px;padding:4px 8px">'+eq.name+'</button>'
            })
          }
        }
        acts+='<button class="btn btn-danger" onclick="clearSel();if(G)G._updateButtons()" style="font-size:12px;padding:4px 12px">取消</button>'
        ua.innerHTML=acts
      }else{
        ud.style.display='none'
      }
    }catch(e){console.error(e)}
  }
}
function skipUnit(){if(SEL.u&&!SEL.u.done){SEL.u.done=true;clearSel();G._updateButtons()}}
function stationUnit(){
  let u=SEL.u;if(!u||u.done)return
  if(curP().buildings.some(b=>b.type==='大本营'&&b.inHeal(u.gx,u.gy))){u.stationed=true;u.done=true;clearSel();G._updateButtons()}
}
function endTurn(){
  try{
    clearSel();nextTurn()
    if(G)G._centerOnCur()
    console.log('endTurn OK -> turn '+ENGINE.turn+' player '+ENGINE.cur)
  }catch(e){
    console.error('endTurn error:',e.message,e.stack)
    alert('结束回合出错: '+e.message)
  }
}

// ==================== 渲染 ====================
function render(){
  if(!G||!ctx||!G.cam)return
  ctx.fillStyle=COL_BG;ctx.fillRect(0,0,W,H)
  let vr=G.cam.getVR()
  // 调试：显示渲染状态
  ctx.fillStyle='#ff4040';ctx.font='14px monospace';ctx.textAlign='left';ctx.textBaseline='top'
  ctx.fillText('R:'+ENGINE.state+' VR:'+vr.join(',')+' Z:'+G.cam.z.toFixed(1),10,50)
  for(let x=vr[0];x<vr[2];x++)for(let y=vr[1];y<vr[3];y++)drawTile(x,y)
  for(let k of SEL.hl){let[gx,gy]=k.split(',');drawHL(+gx,+gy,SEL.hc)}
  // 玩家建筑 + 中立建筑
  ENGINE.players.forEach(p=>p.buildings.forEach(b=>{if(b.gx>=vr[0]&&b.gx<vr[2]&&b.gy>=vr[1]&&b.gy<vr[3])drawBuilding(b)}))
  if(G.neutralBuildings)G.neutralBuildings.forEach(b=>{if(b.gx>=vr[0]&&b.gx<vr[2]&&b.gy>=vr[1]&&b.gy<vr[3])drawBuilding(b)})
  ENGINE.players.forEach(p=>p.units.forEach(u=>{if(u.gx>=vr[0]&&u.gx<vr[2]&&u.gy>=vr[1]&&u.gy<vr[3])drawUnit(u)}))
  G.dying.forEach(d=>drawDying(d))
  // 建造虚影
  if(G.buildMode&&G.ghostPos){
    let[gx,gy]=G.ghostPos;let hq=curP().getHQ()
    if(hq&&manh([gx,gy],[hq.gx,hq.gy])<=5){
      let[sx,sy]=G.cam.g2s(gx,gy);let sz=TS*G.cam.z
      ctx.globalAlpha=0.4;ctx.fillStyle='#4a4a8a';ctx.fillRect(sx+2,sy+2,sz-4,sz-4);ctx.strokeStyle='#aaa';ctx.lineWidth=2;ctx.strokeRect(sx+2,sy+2,sz-4,sz-4);ctx.globalAlpha=1
    }
  }
}

function drawTile(x,y){
  let[sx,sy]=G.cam.g2s(x,y);let sz=TS*G.cam.z
  let t=G.grid.get(x,y);if(!t)return
  let base=(x+y)%2===0?COL_GL:COL_GD
  let tc={'water':'#283250','forest':'#1e3c1e','mountain':'#3c3728','road':'#37322d'}
  ctx.fillStyle=tc[t.terrain]||base;ctx.fillRect(sx,sy,sz,sz)
  ctx.strokeStyle='#282828';ctx.lineWidth=1;ctx.strokeRect(sx,sy,sz,sz)
}
function drawHL(gx,gy,c){
  let[sx,sy]=G.cam.g2s(gx,gy);let sz=TS*G.cam.z
  ctx.fillStyle=c;ctx.fillRect(sx,sy,sz,sz)
}
// 贴图缓存（尝试加载PNG，失败回退图标）
let SPR={}
function loadSpr(name){
  if(SPR[name]!==undefined)return SPR[name]
  let img=new Image()
  img.onload=function(){SPR[name]=img}
  img.onerror=function(){SPR[name]=null}
  try{img.src='picture/'+name+'.png'}catch(e){SPR[name]=null}
  SPR[name]=null
  return null
}
function drawUnit(u){
  let[sx,sy]=G.cam.g2s(u.gx,u.gy);let sz=TS*G.cam.z;let hsz=sz/2;let cx=sx+hsz,cy=sy+hsz
  // 有装备时尝试加载装备贴图，否则加载默认贴图
  let sprKey=u.equip?u.type+'-'+u.equip.name:u.type
  let img=SPR[sprKey]
  if(img===undefined){
    let impath='picture/'+sprKey+'.png'
    let tried=false
    // 先检查本地是否有装备贴图（用同步Image测试）
    let testImg=new Image()
    testImg.onload=function(){SPR[sprKey]=testImg}
    testImg.onerror=function(){SPR[sprKey]=null;if(!tried){tried=true;SPR[u.type]=null}}
    try{testImg.src=impath}catch(e){SPR[sprKey]=null}
    // 延迟给默认贴图一个机会
    setTimeout(function(){if(SPR[sprKey]===undefined){let d=new Image();d.onload=function(){SPR[sprKey]=d};d.onerror=function(){SPR[sprKey]=null};try{d.src='picture/'+u.type+'.png'}catch(e){SPR[sprKey]=null}}},100)
    SPR[sprKey]=null
    img=null
  }
  if(img && img.complete && img.naturalWidth>0){
    try{ctx.drawImage(img,sx,sy,sz,sz)}catch(e){}
  }else{
    // 回退几何形状
    ctx.fillStyle=PLAYER_COLORS[u.pid];ctx.strokeStyle='#222';ctx.lineWidth=Math.max(1,sz*.04)
    if(u.type==='士兵'||u.type==='军用吉普'){
      ctx.beginPath();ctx.arc(cx,cy,hsz*.5,0,Math.PI*2);ctx.fill();ctx.stroke()
    }else if(u.type==='坦克'||u.type==='装甲车'){
      ctx.fillRect(sx+sz*.1,sy+sz*.15,sz*.8,sz*.7);ctx.strokeRect(sx+sz*.1,sy+sz*.15,sz*.8,sz*.7)
    }else if(u.isAir){
      ctx.beginPath();ctx.moveTo(cx,sy+sz*.15);ctx.lineTo(cx+sz*.5,cy);ctx.lineTo(cx,sy+sz*.85);ctx.lineTo(cx-sz*.5,cy);ctx.closePath();ctx.fill();ctx.stroke()
    }else{
      ctx.beginPath();ctx.arc(cx,cy,hsz*.5,0,Math.PI*2);ctx.fill();ctx.stroke()
    }
  }
  if(!u.done){ctx.beginPath();ctx.arc(cx,cy,hsz*.55,0,Math.PI*2);ctx.strokeStyle=COL_WHITE;ctx.lineWidth=2;ctx.stroke()}
  let bw=sz*.7,bh=Math.max(3,sz*.06),bx=sx+(sz-bw)/2,by=sy+sz-bh-3
  let ratio=Math.max(0,u.hp/u.maxHp)
  ctx.fillStyle='#14141e';ctx.fillRect(bx,by,bw,bh)
  ctx.fillStyle=ratio>.5?'#32dc32':ratio>.25?'#d4c040':'#dc3232';ctx.fillRect(bx,by,bw*ratio,bh)
}
function drawBuilding(b){
  let[sx,sy]=G.cam.g2s(b.gx,b.gy);let sz=TS*G.cam.z
  let name=b.type
  if(b.type==='大本营')name=b.tier>=2?'大本营T3':'大本营 T'+(b.tier+1)
  let img=SPR[name]
  if(!img){
    img=new Image()
    let loaded=false
    img.onload=function(){SPR[name]=this;loaded=true}
    img.onerror=function(){
      if(!loaded){
        // 尝试.jpg
        let img2=new Image()
        img2.onload=function(){SPR[name]=img2}
        img2.onerror=function(){SPR[name]=null}
        try{img2.src='picture/'+name+'.jpg'}catch(e){SPR[name]=null}
      }
    }
    try{img.src='picture/'+name+'.png'}catch(e){SPR[name]=null}
  }
  if(img&&img.complete&&img.naturalWidth>0){
    try{ctx.drawImage(img,sx,sy,sz,sz)}catch(e){}
    // 血条
    let bw=sz*.6,bh=Math.max(3,sz*.06),bx=sx+(sz-bw)/2,by=sy+sz-bh-3
    let ratio=Math.max(0,b.hp/b.maxHp)
    ctx.fillStyle='#14141e';ctx.fillRect(bx,by,bw,bh)
    ctx.fillStyle=ratio>.5?'#32dc32':ratio>.25?'#d4c040':'#dc3232';ctx.fillRect(bx,by,bw*ratio,bh)
    return
  }
  // 回退图标
  if(b.type==='大本营'){
    let colors=['#3a6a3a','#3a5a8a','#8a5a3a'];let icons=['▲','◆','⬟']
    ctx.fillStyle=colors[b.tier]||'#3a5a3a'
    ctx.fillRect(sx+2,sy+2,sz-4,sz-4);ctx.strokeStyle='#888';ctx.lineWidth=2;ctx.strokeRect(sx+2,sy+2,sz-4,sz-4)
    ctx.fillStyle=COL_WHITE;ctx.font='bold '+Math.floor(sz*.4)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle'
    ctx.fillText(icons[b.tier]||'▲',sx+sz/2,sy+sz/2)
  }else if(b.type==='据点'){
    ctx.fillStyle=b.pid>=0?PLAYER_COLORS[b.pid]:'#6a6a7a'
    ctx.fillRect(sx+2,sy+2,sz-4,sz-4);ctx.strokeStyle='#888';ctx.lineWidth=2;ctx.strokeRect(sx+2,sy+2,sz-4,sz-4)
    ctx.fillStyle=COL_WHITE;ctx.font='bold '+Math.floor(sz*.4)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle'
    ctx.fillText('⚑',sx+sz/2,sy+sz/2)
  }
  let bw=sz*.6,bh=Math.max(3,sz*.06),bx=sx+(sz-bw)/2,by=sy+sz-bh-3
  let ratio=Math.max(0,b.hp/b.maxHp)
  ctx.fillStyle='#14141e';ctx.fillRect(bx,by,bw,bh)
  ctx.fillStyle=ratio>.5?'#32dc32':ratio>.25?'#d4c040':'#dc3232';ctx.fillRect(bx,by,bw*ratio,bh)
  // 建造中进度条
  if(b.underConstruction){
    ctx.fillStyle='#8888ff80';ctx.fillRect(sx+2,sy+2,sz-4,4)
    let pct=1-(b.buildTimer||4)/4
    ctx.fillStyle='#4444ff';ctx.fillRect(sx+2,sy+2,(sz-4)*pct,4)
  }
}
function drawDying(d){
  let u=d.ent;if(!u)return
  ctx.globalAlpha=Math.max(0,d.alpha/200)
  drawUnit(u)
  let[sx,sy]=G.cam.g2s(u.gx,u.gy);let sz=TS*G.cam.z
  ctx.fillStyle='#ff000080';ctx.fillRect(sx,sy,sz,sz)  // 红色覆盖
  ctx.globalAlpha=1
}

// ==================== 回合提示 ====================
let notifyTimer=0
function showTurnNotify(){
  let el=document.getElementById('turn-notify');let p=curP()
  document.getElementById('notifyTxt').textContent='第 '+ENGINE.turn+' 回合 — '+p.name
  document.getElementById('notifyTxt').style.color=PLAYER_COLORS[p.id]
  el.style.display='flex';notifyTimer=50
}

// ==================== 菜单函数 ====================
function showPlayerSel(){
  document.getElementById('menu').style.display='none'
  document.getElementById('player-sel').style.display='flex'
}
function backToMenu(){
  document.getElementById('player-sel').style.display='none'
  document.getElementById('menu').style.display='flex'
}
function openEncyclopedia(){
  try{window.open('encyclopedia/index.html','_blank')}catch(e){}
}
function startGame(n){
  console.log('startGame called with n='+n)
  document.getElementById('player-sel').style.display='none'
  document.getElementById('gameOver').style.display='none'
  console.log('calling initEngine...')
  initEngine(n)
  console.log('ENGINE.state='+ENGINE.state+', players='+ENGINE.players.length)
  console.log('calling new Game...')
  try{
    new Game()
    console.log('Game created, G='+(!!G))
  }catch(e){
    console.error('Game constructor error:',e.message,e.stack)
    alert('游戏初始化失败: '+e.message)
    return
  }
  console.log('calling showTurnNotify')
  showTurnNotify()
  console.log('startGame complete')
}

// ==================== 主循环 ====================
function gameLoop(){
  try{
    if(G&&ENGINE.state==='PLAYING'){
      G.update();render()
    }else if(ctx){
      ctx.fillStyle='#1a1a2a';ctx.fillRect(0,0,W,H)
      ctx.fillStyle='#6a6a7a';ctx.font='18px sans-serif';ctx.textAlign='center'
      ctx.fillText('G='+(!!G)+' ST='+ENGINE.state+' P='+ENGINE.players.length,W/2,H/2)
    }
  }catch(e){}
  if(notifyTimer>0){
    notifyTimer--
    if(notifyTimer===0)document.getElementById('turn-notify').style.display='none'
  }
  requestAnimationFrame(gameLoop)
}

// ==================== 初始化 ====================
function boot(){
  cvs=document.getElementById('gc')
  if(!cvs){setTimeout(boot,50);return}
  ctx=cvs.getContext('2d')
  resize()
  let md=false
  cvs.addEventListener('mousedown',e=>{
    if(!G)return
    if(e.button===0){md=true;G.cam.startDrag(e.clientX,e.clientY);let[gx,gy]=G.cam.s2g(e.clientX,e.clientY);G._handleClick(gx,gy)}
    if(e.button===2)e.preventDefault()
  })
  cvs.addEventListener('mousemove',e=>{
    if(!G)return
    if(md)G.cam.updateDrag(e.clientX,e.clientY)
    let[gx,gy]=G.cam.s2g(e.clientX,e.clientY)
    if(G.buildMode)G.ghostPos=[gx,gy]  // 建造虚影位置
    let t=G.grid.get(gx,gy);let tip=document.getElementById('tooltip')
    if(t&&t.occ){
      let o=t.occ;let lines=''
      if(o instanceof Unit)lines=(o.pid>=0?'玩家'+(o.pid+1)+' | ':'中立 | ')+o.type+' HP:'+o.hp.toFixed(1)+'/'+o.maxHp+' 护甲:'+o.armor+' 伤害:'+o.damage+' 射程:'+o.range+(o.done?' [Done]':' [Ready]')
      else lines=(o.pid>=0?'玩家'+(o.pid+1):'中立')+' | '+o.type+' HP:'+Math.floor(o.hp)+'/'+Math.floor(o.maxHp)+' 护甲:'+o.armor+(o.type==='大本营'?' T'+(o.tier+1):'')
      tip.textContent=lines;tip.style.display='block';tip.style.left=Math.max(10,Math.min(e.clientX+15,W-270))+'px';tip.style.top=Math.min(e.clientY-10,H-60)+'px'
    }else tip.style.display='none'
  })
  cvs.addEventListener('mouseup',e=>{if(e.button===0&&G&&G.cam){md=false;G.cam.endDrag()}})
  cvs.addEventListener('wheel',e=>{e.preventDefault();if(!G||!G.cam)return;if(e.deltaY<0)G.cam.zoomAt(e.clientX,e.clientY,.15);else G.cam.zoomAt(e.clientX,e.clientY,-.15)},{passive:false})
  cvs.addEventListener('contextmenu',e=>e.preventDefault())
  document.addEventListener('keydown',e=>{
    if(e.key==='F11'){e.preventDefault();if(!document.fullscreenElement)document.body.requestFullscreen();else document.exitFullscreen();return}
    if(!G)return;let sp=8/Math.max(.1,G.cam.z)
    if(e.key==='w'||e.key==='W'||e.key==='ArrowUp')G.cam.pan(0,sp)
    if(e.key==='s'||e.key==='S'||e.key==='ArrowDown')G.cam.pan(0,-sp)
    if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft')G.cam.pan(sp,0)
    if(e.key==='d'||e.key==='D'||e.key==='ArrowRight')G.cam.pan(-sp,0)
    if(e.key==='Escape')clearSel()
    if(e.key==='Enter'&&ENGINE.state==='PLAYING')endTurn()
  })
  gameLoop()
}
window.addEventListener('resize',resize)
setTimeout(boot,10)
</script>
